<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Needs Tree — Parent Zoom Protocol</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E14;--card:#111A24;--field:#0d141c;--gold:#F2A65A;--gl:#FFCF96;--cy:#00E5FF;--warn:#E08A9A;--ink:#E6EEF5;--mute:#7A8D9C;--line:#1F2C3A;
  --c-roots:#6B7F94;--c-trunk:#5B8FB9;--c-branches:#4A9DB8;--c-leaves:#7BA8C4;--c-fruits:#7A6B9C;
  --c-healthy:#5B8FB9;--c-moderate:#C68B4A;--c-strained:#B85C6B;
  --radius:14px;--radius-sm:10px;--radius-xs:8px;
  color-scheme:dark;
  --font-display:'Fraunces',Georgia,serif;--font-body:'Public Sans',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.2}
h1{color:var(--gl);font-size:2rem;margin-bottom:8px}
p{max-width:72ch}
.app{display:flex;min-height:100dvh}
.sidebar{width:260px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:24px 0;position:fixed;top:0;bottom:0;left:0;z-index:100;display:flex;flex-direction:column;transition:transform .3s}
.sidebar-brand{padding:0 24px 24px;display:flex;align-items:center;gap:10px}
.sidebar-brand span{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--gl)}
.nav{flex:1;padding:0 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);font-size:.95rem;font-weight:500;color:var(--mute);transition:all .2s;cursor:pointer;width:100%;text-align:left;background:none;border:none;font-family:inherit}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--gold);color:#000;font-weight:600}
.nav-icon{width:20px;height:20px;opacity:.7;flex-shrink:0}
.nav-item.active .nav-icon{opacity:1}
.main{flex:1;margin-left:260px;padding:32px 40px 80px;max-width:100%}
.mobile-header{display:none;align-items:center;gap:12px;margin-bottom:24px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);position:sticky;top:0;z-index:50}
.mobile-header button{padding:8px;border-radius:var(--radius-xs);background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;color:var(--ink)}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:20px 16px 60px}
  .mobile-header{display:flex}
}
.page{display:none;flex:1}
.page.active{display:block}
.sub{color:var(--mute);font-size:.95rem;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;transition:all .2s;min-height:44px;border:1.5px solid transparent;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--gold);color:#000}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{border-color:var(--line);color:var(--ink);background:var(--card)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-ghost{color:var(--mute);background:none}
.btn-ghost:hover{color:var(--ink)}
.btn-small{padding:8px 14px;font-size:.82rem;min-height:36px}
.btn:disabled{opacity:.4;pointer-events:none}
.today-hero{text-align:center;margin-bottom:32px}
.today-hero p{color:var(--mute);font-size:1.05rem;margin:0 auto;max-width:520px}
.onboarding{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;max-width:560px;margin:0 auto}
.onboarding h1{font-size:2.2rem;margin-bottom:16px}
.onboarding p{font-size:1.08rem;color:var(--mute);margin-bottom:24px;line-height:1.7;margin-left:auto;margin-right:auto}
.onboarding .btn{width:100%;justify-content:center;padding:16px;margin-bottom:12px}
.step-indicator{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.step-dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .2s}
.step-dot.active{background:var(--gold);transform:scale(1.25)}
.step-dot.done{background:var(--c-healthy)}
.step-dot.skipped{background:var(--warn);opacity:.5}
.context-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
@media(max-width:520px){.context-grid{grid-template-columns:1fr}}
.context-card{padding:22px 18px;border-radius:var(--radius);border:2px solid var(--line);background:var(--card);cursor:pointer;transition:all .2s;text-align:center}
.context-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.context-card .cc-icon{font-size:2rem;margin-bottom:8px;color:var(--gold)}
.context-card .cc-title{font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.context-card .cc-desc{font-size:.8rem;color:var(--mute);margin-top:4px}
.diag-progress{height:6px;background:var(--line);border-radius:3px;margin-bottom:32px;overflow:hidden;max-width:600px;margin-left:auto;margin-right:auto}
.diag-bar{height:100%;background:var(--gold);width:0;transition:width .4s ease}
.diag-q{max-width:600px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:32px 28px}
.diag-q .q-layer{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:12px}
.diag-q .q-text{font-family:var(--font-display);font-size:1.3rem;margin-bottom:24px;line-height:1.4}
.diag-scale{display:flex;gap:8px}
.diag-scale button{flex:1;min-width:50px;padding:14px 8px;border:2px solid var(--line);border-radius:var(--radius-sm);font-size:.9rem;background:var(--bg);transition:all .2s;min-height:56px;color:var(--ink);cursor:pointer;font-family:inherit}
.diag-scale button:hover{border-color:var(--gold)}
.diag-scale button.sel{background:var(--gold);color:#000;border-color:var(--gold)}
.diag-scale .lab{display:block;font-size:.7rem;margin-top:4px;opacity:.7}
.results-container{max-width:760px;margin:0 auto}
.tree-state{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);overflow:hidden;margin-bottom:20px}
.ts-row{border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.ts-row:last-child{border-bottom:none}
.ts-row:hover{background:rgba(255,255,255,0.02)}
.ts-line{display:flex;align-items:center;gap:10px;padding:14px 16px}
.ts-name{font-family:var(--font-display);font-weight:700;font-size:1rem;flex:0 0 auto;min-width:80px}
.ts-score{font-size:.8rem;color:var(--mute);flex:0 0 auto;min-width:90px;text-align:right;margin-left:auto}
.ts-track{width:60px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex-shrink:0}
.ts-fill{display:block;height:100%;border-radius:3px}
.ts-panel{padding:16px;border-top:1px dashed var(--line);background:var(--bg)}
.layer-bar-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;cursor:pointer}
.lbi-info{flex:1}
.lbi-name{font-family:var(--font-display);font-weight:700;font-size:1rem;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbi-score{font-size:.8rem;color:var(--mute)}
.lbi-track{width:100px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.lbi-fill{height:100%;border-radius:4px}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:.9rem;cursor:pointer;transition:all .2s;color:var(--ink);font-family:inherit;text-align:left}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.chip.emergency{box-shadow:0 0 0 2px var(--c-strained)}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:32px}
.game-card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:22px;transition:all .2s;display:flex;flex-direction:column;gap:10px}
.game-card.live{cursor:pointer}
.game-card.live:hover{border-color:var(--gold);transform:translateY(-2px)}
.gc-title{font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.gc-pitch{font-size:.9rem;color:var(--mute);line-height:1.5;flex:1}
.flinch-card{border:1px solid var(--warn);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;background:rgba(224,138,154,0.05)}
.flinch-card h3{color:var(--warn);font-size:1.1rem;margin-bottom:4px}
.flinch-card .shadow{color:var(--warn);font-size:.85rem;margin-bottom:6px}
.flinch-card .integrated{color:var(--cy);font-size:.85rem}
input,textarea,select{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;margin-bottom:10px;font-family:var(--font-body)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{min-height:90px;resize:vertical;font-family:var(--font-display);font-size:1.02rem;line-height:1.55}
label{display:block;font-size:.72rem;color:var(--gold);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.field-help{font-size:.78rem;color:var(--mute);margin:-4px 0 10px;line-height:1.5}
.action-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.action-row.left{justify-content:flex-start}
.hide{display:none !important}
.phase-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;max-width:720px;margin-left:auto;margin-right:auto}
.phase-card.warn{border-color:var(--warn)}
.phase-card.optional{border-style:dashed;border-color:var(--line);background:rgba(17,26,36,0.6)}
.phase-card .pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.phase-card .pc-phase{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.phase-card .pc-time{font-size:.75rem;color:var(--mute)}
.phase-card h2{font-size:1.3rem;margin-bottom:6px;color:var(--gl)}
.phase-card .pc-purpose{font-size:.9rem;color:var(--mute);margin-bottom:16px;line-height:1.55}
.verbatim-block{background:var(--bg);border-left:3px solid var(--gold);padding:14px 16px;border-radius:8px;margin:12px 0;font-family:var(--font-display);font-size:1.02rem;line-height:1.55;color:var(--ink);font-style:italic}
.verbatim-block .vb-label{font-family:var(--font-body);font-style:normal;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:6px;display:block}
.opt-label{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);background:var(--bg);border:1px dashed var(--line);padding:3px 10px;border-radius:20px;margin-bottom:8px}
.opt-label::before{content:"◇";color:var(--gold)}
.consent-row{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);margin-bottom:10px;cursor:pointer;transition:all .2s}
.consent-row:hover{border-color:var(--gold)}
.consent-row.on{border-color:var(--gold);background:rgba(242,166,90,0.06)}
.consent-row .cr-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;margin-top:2px;transition:all .2s}
.consent-row.on .cr-dot{background:var(--gold);border-color:var(--gold)}
.consent-row .cr-body{flex:1;min-width:0}
.consent-row .cr-title{font-weight:600;font-size:.92rem;margin-bottom:2px}
.consent-row .cr-desc{font-size:.78rem;color:var(--mute);line-height:1.45}
.airtable-note{font-size:.72rem;color:var(--mute);background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:10px;border-left:2px solid var(--line);line-height:1.5}
.airtable-note strong{color:var(--cy);font-weight:600}
.skip-note{font-size:.75rem;color:var(--mute);font-style:italic;margin-top:8px}
.insight-box{background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.3);border-radius:var(--radius-sm);padding:16px;margin:16px 0;font-size:.9rem;line-height:1.6}
.insight-box strong{color:var(--cy)}
.safety-note{font-size:.76rem;color:var(--mute);text-align:center;margin-top:32px;padding:16px;border-top:1px solid var(--line)}
.counter{font-size:.8rem;color:var(--mute);text-align:center;margin-bottom:10px}
.counter strong{color:var(--gold)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>

<script>

const LORDER = ["roots","trunk","branches","leaves","fruits"];

const PARENT_QUIZ = [
  { layer:"roots",    text:"I'm so focused on my child's needs that I've stopped meeting my own." },
  { layer:"roots",    text:"Our home or routine feels chaotic — I can't get a stable footing." },

/* Core needs catalogue (subset, parent-prioritised first) */
const C = {

/* Reframe strategies (subset; fallback used when absent) */
const REFRAME = {

  "Identity":{excuse:"I don't know who I am anymore — I've been everyone's everything.",strategy:"Filling every hour with roles so there's no space to notice the gap.",actions:["Write down three things you liked before you started performing.","Spend 20 minutes alone with no task.","List five things true about you that aren't your roles.","Do one thing no one in your life knows about.","Write 'I am someone who...' and finish it three ways."]},

  "Peer community":{excuse:"Nobody else gets it.",strategy:"Isolating, then confirming no one understands.",actions:["Find one group where you don't have to explain.","Look for one online parent community.","Reach out to one parent who gets it.","Join one thing where everyone's there for the same reason.","Ask one parent: do you feel this too?"]},
  "Mutuality":{excuse:"I'll keep giving — it's fine.",strategy:"Keeping score silently.",actions:["In one relationship, ask for one thing.","Say yes to receiving something.","Let someone do something for you.","Name one thing you'd like your partner to take over.","Say 'I need help with this' once."]},

/* ==========================================================================

   ========================================================================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function scoreStatus(s){ if(s<=3)return "healthy"; if(s<=7)return "moderate"; return "strained"; }
function isEmergency(layer,name){ return (state.emergencyPicks[layer]||[]).indexOf(name)>=0; }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function now(){ return new Date(); }
function todayStr(){ const d=now(); const m=["January","February","March","April","May","June","July","August","September","October","November","December"]; return m[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); }
function totalEmergencies(){ return LORDER.reduce((n,l)=>n+(state.emergencyPicks[l]||[]).length,0); }
function needsFor(layer){ return C[layer] || []; }

function navigateTo(pageId){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const t=document.getElementById('page-'+pageId);
  if(t)t.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===pageId));
  document.getElementById('sidebar').classList.remove('open');
  if(pageId==='protocol') renderProtocol();
  if(pageId==='today') renderToday();
  if(pageId==='quiz') renderQuiz();
  if(pageId==='dark') renderDark();
  if(pageId==='play') renderPlay();
  if(pageId==='tree') renderTree();
  if(pageId==='journal') renderJournal();
  if(pageId==='reflexivity') renderReflexivity();
  if(pageId==='export') renderExport();
  window.scrollTo(0,0);
}

/* ==========================================================================
   PROTOCOL — phase-ordered flow mirrors the Excel
   ========================================================================== */
function phaseState(p){
  if(state.phaseDone[p]) return "done";
  if(state.phaseSkipped[p]) return "skipped";
  if(state.phase===p) return "active";
  return "pending";
}
function stepDots(){
  return '<div class="step-indicator">'+PHASES.map(p=>{
    const s=phaseState(p);
    return '<div class="step-dot '+(s==="active"?"active":s==="done"?"done":s==="skipped"?"skipped":"")+'" title="'+p+'"></div>';
  }).join("")+'</div>';
}

function renderProtocol(){
  const c=document.getElementById('protocolBody');
  const p=state.phase;

  /* Welcome / intro if nothing started */
  if(p==="gate" && !state.phaseDone.gate && !state.consent.participate){
    c.innerHTML = '<div class="onboarding">'+
      '<h1>Tree of Needs — Parent Protocol</h1>'+
      '<p>This is a guided 95-minute reflection, not therapy or diagnosis. It follows the research protocol step by step. Every phase is optional after consent — you can skip, change your mind, pause, or stop at any time.</p>'+
      '<p style="font-size:.85rem;color:var(--mute)">The app stores your notes on this device only. Use a participant code (e.g. TN-014), not a name.</p>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px">'+
        '<button class="btn btn-primary" onclick="startProtocol()">Start the protocol</button>'+
        '<button class="btn btn-outline" onclick="navigateTo(\'quiz\')">Just the 15 statements</button>'+
      '</div>'+
    '</div>';
    return;
  }

  /* Phase-specific rendering */
  let html = '<div class="today-hero"><h1>Protocol</h1><p>The 10 phases from the research sheet, in order. Optional Mom-Test probes are marked ◇ and never required.</p></div>'+stepDots();

  if(p==="gate") html += phaseGate();
  else if(p==="baseline") html += phaseBaseline();
  else if(p==="softdive") html += phaseSoftDive();
  else if(p==="buildtree") html += phaseBuildTree();
  else if(p==="mirror") html += phaseMirror();
  else if(p==="quiz") html += phaseQuiz();
  else if(p==="dark") html += phaseDark();
  else if(p==="anchor") html += phaseAnchor();
  else if(p==="certificate") html += phaseCertificate();
  else if(p==="return") html += phaseReturn();
  else if(p==="reflexivity") html += phaseReflexivity();

  c.innerHTML = html;
  bindPhaseHandlers();
}
window.renderProtocol = renderProtocol;

function startProtocol(){ state.phase="gate"; saveState(); renderProtocol(); }
window.startProtocol = startProtocol;

function completePhase(p){
  state.phaseDone[p]=true;
  const idx=PHASES.indexOf(p);
  if(idx<PHASES.length-1) state.phase=PHASES[idx+1];
  saveState();
  renderProtocol();
}
window.completePhase = completePhase;

function skipPhase(p,reason){
  state.phaseSkipped[p]=true;
  if(reason) state.phaseSkipped[p+"_reason"]=reason;
  const idx=PHASES.indexOf(p);
  if(idx<PHASES.length-1) state.phase=p===PHASES[idx]?PHASES[idx+1]:PHASES[idx+1];
  saveState();
  renderProtocol();
}
window.skipPhase = skipPhase;

function goToPhase(p){ state.phase=p; saveState(); renderProtocol(); }
window.goToPhase = goToPhase;

/* ---------- Phase 1: The Gate ---------- */

    '<div class="consent-row '+(c.record===true?"on":"")+'" data-consent="record"><div class="cr-dot"></div><div class="cr-body"><div class="cr-title">Recording permission</div><div class="cr-desc">Separate from participation. If declined, do not record.</div></div></div>'+
    '<div class="consent-row '+(c.photo===true?"on":"")+'" data-consent="photo"><div class="cr-dot"></div><div class="cr-body"><div class="cr-title">Photo permission</div><div class="cr-desc">Separate again. For the Certificate phase only.</div></div></div>'+
    '<div class="field-help">Safety pause: if the participant becomes uncomfortable, pause. Update this only if it happens.</div>'+
    '<select id="safetyPause"><option value="">Not yet assessed</option><option value="no" '+(state.safetyPause==="no"?"selected":"")+'>No pause occurred</option><option value="yes" '+(state.safetyPause==="yes"?"selected":"")+'>Pause occurred</option></select>'+

}

    '<textarea id="btMismatch" placeholder="Exact quote + context.">'+esc(bt.mismatch||"")+'</textarea>'+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Framework Fit Observed · Tree map / card placements · Participant explanation of reflection. If she says "This doesn\'t fit", ask "Why does this need belong here for you? Would it fit somewhere else?" Do not force a category. Log Category Mismatch with exact quote.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="btComplete">Continue to The Mirror →</button><button class="btn btn-ghost" onclick="goToPhase(\'softdive\')">← Back</button></div>'+
  '</div>';
}

/* ---------- Phase 5: The Mirror ---------- */
function phaseMirror(){
  const m=state.mirror;
  return '<div class="phase-card">'+
    '<div class="pc-head"><div class="pc-phase">Phase 5 · The Mirror</div><div class="pc-time">45–55 min</div></div>'+
    '<h2>Explore a possible tension without forcing a contradiction</h2>'+
    '<p class="pc-purpose">If a potentially relevant tension appears, describe the two observations neutrally and invite her interpretation. Do not manufacture a tension if none is evident.</p>'+
    '<div class="verbatim-block"><span class="vb-label">Say aloud — only if grounded</span>"I noticed you placed \'Autonomy\' here, but earlier you mentioned feeling controlled. I\'m not saying this is wrong. I\'m curious: how do these live together in your life?"<br><br>"Does this feel like a problem to solve, a tension to hold, or something else?"</div>'+
    '<label>The two observations (only if she independently raised both)</label>'+
    '<textarea id="mirrorObserved" placeholder="Neutral description. Do not introduce concepts she hasn\'t used.">'+esc(m.observed||"")+'</textarea>'+
    '<div class="opt-label">OPTIONAL Mom-Test — only if she independently described both sides</div>'+
    '<div class="field-help">"Can you walk me through a recent example? How do you understand what was happening there?"</div>'+
    '<textarea id="mirrorResponse" placeholder="Her account. Do not require the tension to be resolved.">'+esc(m.participantResponse||"")+'</textarea>'+
    '<label>Status</label>'+
    '<select id="mirrorStatus"><option value="">— not assessed —</option><option value="confirmed" '+(m.tensionStatus==="confirmed"?"selected":"")+'>Tension confirmed</option><option value="rejected" '+(m.tensionStatus==="rejected"?"selected":"")+'>Rejected</option><option value="clarified" '+(m.tensionStatus==="clarified"?"selected":"")+'>Clarified</option><option value="none" '+(m.tensionStatus==="none"?"selected":"")+'>No grounded tension arose</option></select>'+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Interpretation evidence / explanation · Tension confirmed / rejected / clarified. Use only if her actual responses support it. If she does not see a tension, say "Okay, thank you for clarifying" and move on.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="mirrorComplete">Continue to Quiz →</button><button class="btn btn-ghost" onclick="goToPhase(\'buildtree\')">← Back</button></div>'+
  '</div>';
}

/* ---------- Phase 6: Quiz / Emergencies ---------- */
function phaseQuiz(){
  const total=totalEmergencies();
  const scores=state.diagScores;
  const layerFocus = state.diagStrained || "roots";
  const needs = needsFor(layerFocus);
  return '<div class="phase-card">'+
    '<div class="pc-head"><div class="pc-phase">Phase 6 · The Quiz / Emergencies</div><div class="pc-time">55–65 min</div></div>'+
    '<h2>Test realism and actively seek disconfirming evidence</h2>'+
    '<p class="pc-purpose">Invite her to name what is destabilising her; avoid imposing the label "emergency." Ask whether the framework\'s suggested priority is realistic in her actual circumstances.</p>'+
    '<div class="verbatim-block"><span class="vb-label">Say aloud</span>"We\'re going to look at what\'s destabilizing you right now, but let\'s not use the word \'emergency.\' What would you call it?"<br><br>"Do you agree with what the framework suggests is your priority? Is it realistic for your actual life — with a 2-year-old, a 5-year-old, and a 7-year-old?"</div>'+
    (scores?
      '<div class="insight-box"><strong>Framework suggests:</strong> start with '+L[layerFocus]+'. <strong>Participant\'s word for it:</strong> <input type="text" id="participantWord" placeholder="her word for it" style="margin:6px 0 0"></div>'
      : '<p style="font-size:.9rem;color:var(--mute)">The 15 statements are in the Parent Quiz. Take them, then return to this phase.</p><div class="action-row left"><button class="btn btn-primary" onclick="navigateTo(\'quiz\')">Open the 15 statements →</button></div>')+
    (scores?'<label>Is this realistic for your actual life?</label><textarea id="realismJudged" placeholder="Her view of whether framework priority is realistic. Capture evidence, not just yes/no."></textarea>'+
    '<div class="opt-label">OPTIONAL Mom-Test — most recent attempt</div>'+
    '<div class="field-help">"Tell me about the most recent time you tried to make something easier. What did you do? What happened? What got in the way?"</div>'+
    '<textarea id="realismAttempt" placeholder="Attempt · outcome · barriers · trade-offs she reports. Distinguish what happened from what she thinks might happen."></textarea>'+
    '<label>What constraint is the framework not seeing?</label><textarea id="realismConstraint" placeholder="Exact quote + interpretation kept separate."></textarea>':'')+
    '<div style="margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">'+
      '<div style="font-size:.82rem;color:var(--mute);margin-bottom:8px">Emergency cap · <strong style="color:var(--gold)">'+total+' of 3 total</strong> across the whole tree. The squeeze is the point.</div>'+
      '<div class="chip-grid" id="emergencyChips">'+needs.map(n=>{
        const name=n[0]; const on=isEmergency(layerFocus,name);
        return '<button class="chip '+(on?"on":"")+(on?" emergency":"")+'" data-emlayer="'+layerFocus+'" data-emneed="'+esc(name)+'">'+esc(name)+'</button>';
      }).join("")+'</div>'+
      '<div class="field-help">Tap to mark an emergency. Remove one first if the cap is reached.</div>'+
    '</div>'+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Framework Fit Observed · Realism Judged · Failure Logs (Exact Quote and Researcher interpretation kept separate). Do not argue for the framework. If she agrees, still ask where it may not work.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="quizPhaseComplete">Continue to Dark Needs →</button><button class="btn btn-ghost" onclick="goToPhase(\'mirror\')">← Back</button></div>'+
  '</div>';
}

/* ---------- Phase 7: Dark Needs / The Flinch ---------- */
function phaseDark(){
  if(state.darkConsent===false){
    return '<div class="phase-card optional">'+
      '<div class="pc-head"><div class="pc-phase">Phase 7 · Dark Needs</div><div class="pc-time">65–75 min</div></div>'+
      '<h2>Declined</h2>'+
      '<p class="pc-purpose">That is completely fine. Declining is not itself a framework failure. Do not ask for reasons or revisit unless she initiates.</p>'+
      '<div class="airtable-note"><strong>Airtable field:</strong> Dark Needs Consented = No</div>'+
      '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" onclick="goToPhase(\'anchor\')">Continue to Anchor →</button></div>'+
    '</div>';
  }
  return '<div class="phase-card warn">'+
    '<div class="pc-head"><div class="pc-phase">Phase 7 · Dark Needs / The Flinch</div><div class="pc-time">65–75 min</div></div>'+
    '<h2>An optional, potentially uncomfortable topic</h2>'+
    '<p class="pc-purpose">Explain that examples may not apply and that skipping is fine. Ask permission before proceeding. If yes, use open prompts and let her define the meaning.</p>'+
    '<div class="verbatim-block"><span class="vb-label">Ask permission</span>"There is a harder section about needs that can look ugly from the outside: rage, the need to hide, the need to control everything. These are not bad needs. They are often protections. We put this last because it can be uncomfortable. Do you want to go there?"</div>'+
    '<div class="consent-row '+(state.darkConsent===true?"on":"")+'" data-darkconsent="yes"><div class="cr-dot"></div><div class="cr-body"><div class="cr-title">Yes — we can go there</div><div class="cr-desc">Open prompts. She defines the meaning. Stop immediately if she wants to stop.</div></div></div>'+
    '<div class="consent-row '+(state.darkConsent===false?"on":"")+'" data-darkconsent="no"><div class="cr-dot"></div><div class="cr-body"><div class="cr-title">No — skip this section</div><div class="cr-desc">"That\'s completely fine. We don\'t need to go there."</div></div></div>'+
    (state.darkConsent===true?
      '<div class="verbatim-block"><span class="vb-label">If yes — say aloud</span>"Where does this show up in your tree? What is it protecting? What does it cost you?"</div>'+
      '<div class="opt-label">OPTIONAL Mom-Test — only after explicit permission</div>'+
      '<div class="field-help">"Would you like to describe a difficult moment you feel comfortable discussing? What was happening just before? What did you do next? What happened afterward?"</div>'+
      '<textarea id="darkText" placeholder="Her account. Do not assume the experience protected her or had a particular function.">'+esc(state.darkText||"")+'</textarea>'+
      '<div style="margin-top:12px">'+DARK_NEEDS.map(d=>'<div class="flinch-card"><h3>'+d.title+'</h3><p style="font-size:.88rem;color:var(--mute);margin-bottom:6px">'+d.desc+'</p><div class="shadow"><strong>Shadow:</strong> '+d.shadow+'</div><div class="integrated"><strong>Integrated:</strong> '+d.integrated+'</div></div>').join("")+'</div>'
      :'')+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Dark Needs Consented (Yes / No / Not offered / Unclear). Avoid implying that rage, hiding, or control necessarily reflects a hidden need or protective function. Declining is not automatically a framework failure.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="darkComplete">Continue to Anchor →</button><button class="btn btn-ghost" onclick="goToPhase(\'quiz\')">← Back</button></div>'+
  '</div>';
}

/* ---------- Phase 8: The Anchor ---------- */
function phaseAnchor(){
  const a=state.anchor;
  return '<div class="phase-card">'+
    '<div class="pc-head"><div class="pc-phase">Phase 8 · The Anchor</div><div class="pc-time">75–85 min</div></div>'+
    '<h2>Define a participant-led, realistic meaning of "enough"</h2>'+
    '<p class="pc-purpose">Ask for her definition of enough for this season. Do not introduce the sunset metaphor unless she does.</p>'+
    '<div class="verbatim-block"><span class="vb-label">Say aloud</span>"This tree is not a project to perfect. What would \'enough\' look like for you this season, with these three kids — not perfect, not permanently fixed, but enough?"<br><br>"How would you recognise that in everyday life?"</div>'+
    '<label>Her definition of "enough" — verbatim</label>'+
    '<textarea id="anchorEnough" placeholder="Her exact words. Do not supply an ideal definition.">'+esc(a.enough||"")+'</textarea>'+
    '<div class="opt-label">OPTIONAL Mom-Test — recent near-enough moment</div>'+
    '<div class="field-help">"Can you recall a recent moment that came close to your version of \'enough\'? What was happening? What made that possible, if anything?"</div>'+
    '<textarea id="anchorExample" placeholder="Concrete circumstances. Do not imply a single example is a general solution.">'+esc(a.enoughExample||"")+'</textarea>'+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Enough Definition (verbatim) · Context (existing context field). Capture her words as given. If she is unsure, allow uncertainty or a partial answer.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="anchorComplete">Continue to Certificate →</button><button class="btn btn-ghost" onclick="goToPhase(\'dark\')">← Back</button></div>'+
  '</div>';
}

/* ---------- Phase 9: The Certificate ---------- */
function phaseCertificate(){
  const cert=state.certificate;
  return '<div class="phase-card">'+
    '<div class="pc-head"><div class="pc-phase">Phase 9 · The Certificate</div><div class="pc-time">85–90 min</div></div>'+
    '<h2>Invite explicit feedback about what failed, was missing, or was useful</h2>'+
    '<p class="pc-purpose">Hand over the certificate or share the screen. Invite positive, negative, mixed, or no feedback. Photograph only with separate permission.</p>'+
    '<div class="verbatim-block"><span class="vb-label">Say aloud</span>"Please note anything that did not fit, felt unhelpful, was missing, or could be improved. It is also okay if nothing comes to mind. Honest feedback is useful whether positive, negative or mixed."</div>'+
    '<div class="opt-label">OPTIONAL Mom-Test — point of misfit</div>'+
    '<div class="field-help">"Can you recall a point today when the Tree did not fit, was unhelpful, or left something out? What happened?" If nothing comes to mind, accept that; do not press for criticism.</div>'+
    '<textarea id="certFeedback" placeholder="Feedback — positive, negative, mixed, or absent.">'+esc(cert.feedback||"")+'</textarea>'+
    '<label>Photo taken?</label>'+
    '<select id="certPhoto"><option value="">— not assessed —</option><option value="yes" '+(cert.photoTaken===true?"selected":"")+'>Yes (with separate permission)</option><option value="no" '+(cert.photoTaken===false?"selected":"")+'>No</option></select>'+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Failure Logs · Session Outcome / participant feedback. Keep any exact quote separate from researcher interpretation. Respect photo consent independently of recording consent.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="certComplete">Continue to The Return →</button><button class="btn btn-ghost" onclick="goToPhase(\'anchor\')">← Back</button></div>'+
  '</div>';
}

/* ---------- Phase 10: The Return ---------- */
function phaseReturn(){
  const r=state.returnPhase;
  return '<div class="phase-card">'+
    '<div class="pc-head"><div class="pc-phase">Phase 10 · The Return</div><div class="pc-time">90–95 min</div></div>'+
    '<h2>Compare present reflection with baseline without implying causation</h2>'+
    '<p class="pc-purpose">Read the original baseline answers back to her. Ask the final biggest-need question and explore any change — or lack of change — without suggesting the desired result.</p>'+
    '<div class="verbatim-block"><span class="vb-label">Baseline, read back</span>At the start, you said your biggest need was "'+esc(state.baseline.biggestNeed||"— not captured —")+'." What do you say now?</div>'+
    '<label>Final — Biggest need</label>'+
    '<textarea id="returnNeed" placeholder="Participant\'s current answer in their words.">'+esc(r.biggestNeed||"")+'</textarea>'+
    '<div class="verbatim-block"><span class="vb-label">Say aloud</span>"If your answer changed, what changed in how you see it?"<br><br>"If it did not change, did the session confirm something you already knew, deepen it, or leave it untouched?"</div>'+
    '<label>Final — Useful outcome</label>'+
    '<textarea id="returnOutcome" placeholder="Final response about useful outcome, if asked consistently. If not asked, mark appropriately rather than infer.">'+esc(r.usefulOutcome||"")+'</textarea>'+
    '<label>End-of-session interpretation</label>'+
    '<select id="endInterp"><option value="">— choose —</option><option value="Changed" '+(state.endInterpretation==="Changed"?"selected":"")+'>Changed</option><option value="Confirmed" '+(state.endInterpretation==="Confirmed"?"selected":"")+'>Confirmed</option><option value="Deepened" '+(state.endInterpretation==="Deepened"?"selected":"")+'>Deepened</option><option value="Untouched" '+(state.endInterpretation==="Untouched"?"selected":"")+'>Untouched</option><option value="Unclear" '+(state.endInterpretation==="Unclear"?"selected":"")+'>Unclear</option></select>'+
    '<div class="verbatim-block"><span class="vb-label">Close</span>"Thank you. I will reach out in 3 months to see how your tree is growing. Remember, this is a practice, not a test. Do you have any questions before we finish?"</div>'+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Final — Biggest need · Final — Useful outcome · End-of-session interpretation. Choose based on participant\'s account; avoid ranking outcomes. A before/after difference does not prove causation.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="returnComplete">Finish session → Reflexivity</button><button class="btn btn-ghost" onclick="goToPhase(\'certificate\')">← Back</button></div>'+
  '</div>';
}

/* ---------- Post-session: Reflexivity ---------- */
function phaseReflexivity(){
  const r=state.reflexivity;
  return '<div class="phase-card">'+
    '<div class="pc-head"><div class="pc-phase">Immediately after · Reflexivity</div><div class="pc-time">within 30 min</div></div>'+
    '<h2>Document facilitator influence, data quality, and follow-up</h2>'+
    '<p class="pc-purpose">Complete the reflexivity note promptly. Separate observable behaviour from interpretation; note deviations, rephrasing, skipped prompts, or technical issues.</p>'+
    '<label>Where did I lead her?</label><textarea id="rxLed">'+esc(r.led||"")+'</textarea>'+
    '<label>What did I feel defensive about?</label><textarea id="rxDefensive">'+esc(r.defensive||"")+'</textarea>'+
    '<label>What did I want her to say?</label><textarea id="rxWanted">'+esc(r.wanted||"")+'</textarea>'+
    '<label>What did I notice in her body language when we talked about the kids?</label><textarea id="rxObserved">'+esc(r.observed||"")+'</textarea>'+
    '<label>Which questions did I rephrase or skip?</label><textarea id="rxRephrased">'+esc(r.rephrased||"")+'</textarea>'+
    '<label>What did I observe versus infer?</label><textarea id="rxInference">'+esc(r.inferenceVsFact||"")+'</textarea>'+
    '<label>Session data completeness</label>'+
    '<select id="rxComplete"><option value="">— not assessed —</option><option value="Complete" '+(r.complete==="Complete"?"selected":"")+'>Complete</option><option value="Partly complete" '+(r.complete==="Partly complete"?"selected":"")+'>Partly complete</option><option value="Not complete" '+(r.complete==="Not complete"?"selected":"")+'>Not complete</option><option value="Not yet reviewed" '+(r.complete==="Not yet reviewed"?"selected":"")+'>Not yet reviewed</option></select>'+
    '<div class="field-help">If anything is incomplete, mark it accurately and state why. Do not fill blanks as No.</div>'+
    '<div class="airtable-note"><strong>Airtable fields:</strong> Facilitator Reflexivity Note · Session Data Completeness · Follow-up needed? · Session Outcome / participant feedback. Record which optional probes were used, skipped, or adapted.</div>'+
    '<div class="action-row left" style="margin-top:16px"><button class="btn btn-primary" id="rxCompleteBtn">Save reflexivity note → Export</button><button class="btn btn-ghost" onclick="goToPhase(\'return\')">← Back</button></div>'+
  '</div>';
}

/* ==========================================================================
   PHASE HANDLERS (bind after render)
   ========================================================================== */
function bindPhaseHandlers(){
  const p=state.phase;

  if(p==="gate"){
    const code=document.getElementById('participantCode');
    if(code)code.oninput=()=>{state.participantCode=code.value;saveState()};
    document.querySelectorAll('[data-consent]').forEach(el=>{
      el.onclick=()=>{
        const k=el.dataset.consent;
        state.consent[k]=!state.consent[k];
        if(state.consent[k]===false && k==="record"){state.consent.record=false;}
        saveState();renderProtocol();
      };
    });
    const sp=document.getElementById('safetyPause');
    if(sp)sp.onchange=()=>{state.safetyPause=sp.value;saveState()};
    const g=document.getElementById('gateComplete');
    if(g)g.onclick=()=>completePhase("gate");
  }

  if(p==="baseline"){
    const m={baselineWhy:"whyToday",baselineNeed:"biggestNeed",baselineOutcome:"usefulOutcome",baselineProbe:"probe"};
    Object.keys(m).forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{state.baseline[m[id]]=el.value;saveState()}});
    const b=document.getElementById('baselineComplete');
    if(b)b.onclick=()=>completePhase("baseline");
  }

  if(p==="softdive"){
    const free=document.getElementById('softdiveFree');
    if(free)free.oninput=()=>{state.softdive.freeform=free.value;saveState()};
    document.querySelectorAll('#softdiveChips .chip').forEach(el=>{
      el.onclick=()=>{
        state.softdive.placed=state.softdive.placed||{};
        const arr=state.softdive.placed._present=state.softdive.placed._present||[];
        const i=arr.indexOf(el.dataset.card);
        if(i>=0)arr.splice(i,1);else arr.push(el.dataset.card);
        saveState();renderProtocol();
      };
    });
    const choice=document.getElementById('softdiveChoice');
    if(choice)choice.onchange=()=>{state.softdive.choice=choice.value;saveState();renderProtocol()};
    const fit=document.getElementById('softdiveFit');
    if(fit)fit.oninput=()=>{state.softdive.fitNotes=fit.value;saveState()};
    const comp=document.getElementById('softdiveComplete');
    if(comp)comp.onclick=()=>completePhase("softdive");
  }

  if(p==="buildtree"){
    document.querySelectorAll('[data-addlayer]').forEach(el=>{
      el.onclick=()=>{
        const l=el.dataset.addlayer, n=el.dataset.addneed;
        if(!state.treeNeeds[l])state.treeNeeds[l]=[];
        const i=state.treeNeeds[l].indexOf(n);
        if(i>=0)state.treeNeeds[l].splice(i,1);else state.treeNeeds[l].push(n);
        saveState();renderProtocol();
      };
    });
    ["btSituation","btHelps","btMisses","btMismatch"].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      const key={btSituation:"situation",btHelps:"structureHelps",btMisses:"structureMisses",btMismatch:"mismatch"}[id];
      el.oninput=()=>{state.buildtree[key]=el.value;saveState()};
    });
    const c=document.getElementById('btComplete');
    if(c)c.onclick=()=>completePhase("buildtree");
  }

  if(p==="mirror"){
    ["mirrorObserved","mirrorResponse"].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      const key={mirrorObserved:"observed",mirrorResponse:"participantResponse"}[id];
      el.oninput=()=>{state.mirror[key]=el.value;saveState()};
    });
    const st=document.getElementById('mirrorStatus');
    if(st)st.onchange=()=>{state.mirror.tensionStatus=st.value;saveState()};
    const c=document.getElementById('mirrorComplete');
    if(c)c.onclick=()=>completePhase("mirror");
  }

  if(p==="quiz"){
    const pw=document.getElementById('participantWord');
    if(pw)pw.oninput=()=>{state.participantWord=pw.value;saveState()};
    document.querySelectorAll('[data-emlayer]').forEach(el=>{
      el.onclick=()=>{
        const l=el.dataset.emlayer, n=el.dataset.emneed;
        if(!state.emergencyPicks[l])state.emergencyPicks[l]=[];
        const i=state.emergencyPicks[l].indexOf(n);
        if(i>=0)state.emergencyPicks[l].splice(i,1);
        else{
          if(totalEmergencies()>=3){alert("Three emergencies total. Remove one first. The squeeze is the point.");return}
          state.emergencyPicks[l].push(n);
          if(!state.treeNeeds[l])state.treeNeeds[l]=[];
          if(state.treeNeeds[l].indexOf(n)<0)state.treeNeeds[l].push(n);
        }
        saveState();renderProtocol();
      };
    });
    ["realismJudged","realismAttempt","realismConstraint"].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      el.oninput=()=>{state.realism=state.realism||{};state.realism[id]=el.value;saveState()};
    });
    const c=document.getElementById('quizPhaseComplete');
    if(c)c.onclick=()=>completePhase("quiz");
  }

  if(p==="dark"){
    document.querySelectorAll('[data-darkconsent]').forEach(el=>{
      el.onclick=()=>{
        state.darkConsent=el.dataset.darkconsent==="yes";
        saveState();renderProtocol();
      };
    });
    const dt=document.getElementById('darkText');
    if(dt)dt.oninput=()=>{state.darkText=dt.value;saveState()};
    const c=document.getElementById('darkComplete');
    if(c)c.onclick=()=>completePhase("dark");
  }

  if(p==="anchor"){
    ["anchorEnough","anchorExample"].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      const key={anchorEnough:"enough",anchorExample:"enoughExample"}[id];
      el.oninput=()=>{state.anchor[key]=el.value;saveState()};
    });
    const c=document.getElementById('anchorComplete');
    if(c)c.onclick=()=>completePhase("anchor");
  }

  if(p==="certificate"){
    const f=document.getElementById('certFeedback');
    if(f)f.oninput=()=>{state.certificate.feedback=f.value;saveState()};
    const ph=document.getElementById('certPhoto');
    if(ph)ph.onchange=()=>{state.certificate.photoTaken=ph.value==="yes"?true:ph.value==="no"?false:null;saveState()};
    const c=document.getElementById('certComplete');
    if(c)c.onclick=()=>completePhase("certificate");
  }

  if(p==="return"){
    ["returnNeed","returnOutcome"].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      const key={returnNeed:"biggestNeed",returnOutcome:"usefulOutcome"}[id];
      el.oninput=()=>{state.returnPhase[key]=el.value;saveState()};
    });
    const ei=document.getElementById('endInterp');
    if(ei)ei.onchange=()=>{state.endInterpretation=ei.value;saveState()};
    const c=document.getElementById('returnComplete');
    if(c)c.onclick=()=>completePhase("return");
  }

  if(p==="reflexivity"){
    ["rxLed","rxDefensive","rxWanted","rxObserved","rxRephrased","rxInference"].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      const key={rxLed:"led",rxDefensive:"defensive",rxWanted:"wanted",rxObserved:"observed",rxRephrased:"rephrased",rxInference:"inferenceVsFact"}[id];
      el.oninput=()=>{state.reflexivity[key]=el.value;saveState()};
    });
    const comp=document.getElementById('rxComplete');
    if(comp)comp.onchange=()=>{state.reflexivity.complete=comp.value;saveState()};
    const c=document.getElementById('rxCompleteBtn');
    if(c)c.onclick=()=>{completePhase("reflexivity");navigateTo('export')};
  }
}

function computeQuizResult(){
  const scores={roots:0,trunk:0,branches:0,leaves:0,fruits:0};
  PARENT_QUIZ.forEach((q,i)=>{ if(state.diagAnswers[i]!==null) scores[q.layer]+=state.diagAnswers[i]; });

  let max=-1, strained="roots";
  LORDER.forEach(l=>{ if(scores[l]>max){max=scores[l];strained=l;} });
  state.diagStrained=strained;
  saveState();
}

/* Sort it */
function startSortIt(){
  const pool=[];
  LORDER.forEach(l=>needsFor(l).forEach(n=>pool.push({layer:l,name:n[0],desc:n[1]})));
  const dealt=shuffle(pool).slice(0,15);
  state.play={view:"sort",cards:dealt,sorted:{nice:[],painful:[],nonneg:[],emergency:[]},currentIdx:0};
  saveState();renderSortGame();
}
window.startSortIt=startSortIt;
function renderSortGame(){
  const p=state.play;
  if(!p||p.view!=="sort"){renderPlay();return}
  if(p.currentIdx>=p.cards.length){finishSortGame();return}
  const cur=p.cards[p.currentIdx];
  const emCount=p.sorted.emergency.length;
  const piles=[
    {id:"nice",title:"Nice to have"},
    {id:"painful",title:"Painful if unmet"},
    {id:"nonneg",title:"Non-negotiable"},
    {id:"emergency",title:"Emergency (max 3)"}
  ];
  document.getElementById('playBody').innerHTML =
    '<div class="today-hero"><h1>Sort it</h1><p>Card '+(p.currentIdx+1)+' of '+p.cards.length+'. Where does this need go right now?</p></div>'+
    '<div style="max-width:560px;margin:0 auto 20px;text-align:center"><div style="display:inline-block;padding:22px 30px;border:2px solid var(--gold);border-radius:12px;background:var(--card)"><div style="font-family:var(--font-display);font-weight:700;font-size:1.25rem;color:var(--gl)">'+esc(cur.name)+'</div><div style="font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:'+Lcolor[cur.layer]+';margin-top:4px">'+L[cur.layer]+'</div><div style="font-size:.82rem;color:var(--mute);margin-top:6px">'+esc(cur.desc)+'</div></div></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;max-width:720px;margin:0 auto">'+
    piles.map(pl=>{
      const disabled=(pl.id==="emergency"&&emCount>=3)?'opacity:.45;pointer-events:none':'';
      return '<div style="background:var(--card);border:2px dashed var(--line);border-radius:10px;padding:12px;min-height:100px;cursor:pointer;'+disabled+'" onclick="sortInto(\''+pl.id+'\')"><div style="font-family:var(--font-display);font-weight:700;font-size:.92rem;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line)">'+pl.title+' ('+p.sorted[pl.id].length+')</div>'+p.sorted[pl.id].map(n=>'<span style="display:inline-block;padding:3px 8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:.78rem;margin:2px">'+esc(n)+'</span>').join('')+'</div>';
    }).join('')+'</div>'+
    '<div class="action-row"><button class="btn btn-ghost" onclick="state.play={};renderPlay()">Stop</button></div>';
}
function sortInto(pile){
  const p=state.play;
  if(pile==="emergency"&&p.sorted.emergency.length>=3)return;
  p.sorted[pile].push(p.cards[p.currentIdx].name);
  p.currentIdx++;
  saveState();
  if(p.currentIdx>=p.cards.length)finishSortGame();
  else renderSortGame();
}
window.sortInto=sortInto;
function finishSortGame(){
  const p=state.play;
  p.sorted.emergency.forEach(name=>{
    const found=p.cards.find(c=>c.name===name);
    if(!found)return;
    const l=found.layer;
    if(!state.treeNeeds[l])state.treeNeeds[l]=[];
    if(state.treeNeeds[l].indexOf(name)<0)state.treeNeeds[l].push(name);
    if(!state.emergencyPicks[l])state.emergencyPicks[l]=[];
    if(state.emergencyPicks[l].indexOf(name)<0&&state.emergencyPicks[l].length<3)state.emergencyPicks[l].push(name);
  });
  p.sorted.nonneg.forEach(name=>{
    const found=p.cards.find(c=>c.name===name);
    if(!found)return;
    const l=found.layer;
    if(!state.nonNegotiables[l])state.nonNegotiables[l]=[];
    if(state.nonNegotiables[l].indexOf(name)<0)state.nonNegotiables[l].push(name);
  });
  saveState();
  document.getElementById('playBody').innerHTML =
    '<div class="today-hero"><h1>You sorted it.</h1><p>Emergencies go to your tree — ringed in red. Non-negotiables appear on Today.</p></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;max-width:720px;margin:0 auto">'+
    ["emergency","nonneg","painful","nice"].map(k=>'<div style="background:var(--card);border:2px dashed var(--line);border-radius:10px;padding:12px"><div style="font-family:var(--font-display);font-weight:700;font-size:.92rem;margin-bottom:6px">'+({emergency:"Emergency",nonneg:"Non-negotiable",painful:"Painful if unmet",nice:"Nice to have"}[k])+' ('+p.sorted[k].length+')</div>'+p.sorted[k].map(n=>'<span style="display:inline-block;padding:3px 8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:.78rem;margin:2px">'+esc(n)+'</span>').join('')+'</div>').join('')+'</div>'+
    '<div class="action-row"><button class="btn btn-primary" onclick="state.play={};renderPlay()">Play another</button><button class="btn btn-outline" onclick="navigateTo(\'tree\')">Open my tree →</button></div>';
}

function startStrategyGame(){
  const round=shuffle(STRAT).slice(0,3).map(s=>({text:s[0],need:s[1],guess:null,revealed:false}));
  state.play={view:"strategy",round,idx:0};
  saveState();renderStrategyGame();
}
window.startStrategyGame=startStrategyGame;
function renderStrategyGame(){
  const p=state.play;
  if(!p||p.view!=="strategy"){renderPlay();return}
  const cur=p.round[p.idx];
  const allNeeds=[];
  LORDER.forEach(l=>needsFor(l).forEach(n=>allNeeds.push(n[0])));
  const opts=[cur.need].concat(shuffle(allNeeds.filter(n=>n!==cur.need)).slice(0,5));
  const shuffled=shuffle(opts);
  if(cur.revealed){
    document.getElementById('playBody').innerHTML =
      '<div class="today-hero"><h1>Guess the need</h1><p>Card '+(p.idx+1)+' of '+p.round.length+'.</p></div>'+
      '<div style="max-width:480px;margin:0 auto"><div style="padding:24px;border:2px solid var(--gold);border-radius:12px;background:var(--card);text-align:center"><div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:8px">Strategy</div><div style="font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.4">&ldquo;'+esc(cur.text)+'&rdquo;</div></div>'+
      '<div class="phase-card" style="margin-top:16px"><h3 style="font-size:1.05rem;margin-bottom:8px">You guessed: '+esc(cur.guess||"—")+'</h3><p style="font-size:.9rem;color:var(--mute)">This strategy often hides:</p><div style="margin-top:8px"><span style="padding:6px 14px;border-radius:20px;font-size:.88rem;font-weight:600;background:var(--gold);color:#000">'+esc(cur.need)+'</span></div><div class="action-row" style="justify-content:flex-start;margin-top:16px"><button class="btn btn-primary" onclick="nextStrategy()">'+(p.idx+1<p.round.length?"Next →":"Finish")+'</button></div></div></div>';
    return;
  }
  document.getElementById('playBody').innerHTML =
    '<div class="today-hero"><h1>Guess the need</h1><p>Card '+(p.idx+1)+' of '+p.round.length+'. What need is hiding underneath?</p></div>'+
    '<div style="max-width:480px;margin:0 auto"><div style="padding:24px;border:2px solid var(--gold);border-radius:12px;background:var(--card);text-align:center"><div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:8px">Strategy</div><div style="font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.4">&ldquo;'+esc(cur.text)+'&rdquo;</div></div>'+
    '<div class="phase-card" style="margin-top:16px"><h3 style="font-size:1.05rem;margin-bottom:12px">Pick the need you think is hiding</h3><div style="display:flex;flex-wrap:wrap;gap:8px">'+shuffled.map(n=>'<button class="btn btn-outline btn-small" onclick="guessStrategy(\''+esc(n).replace(/'/g,"\\'")+'\')">'+esc(n)+'</button>').join('')+'</div></div></div>';
}
function guessStrategy(n){ state.play.round[state.play.idx].guess=n; state.play.round[state.play.idx].revealed=true; saveState(); renderStrategyGame(); }
window.guessStrategy=guessStrategy;
function nextStrategy(){ if(state.play.idx+1>=state.play.round.length){state.play={};renderPlay();return} state.play.idx++; saveState(); renderStrategyGame(); }
window.nextStrategy=nextStrategy;

/* ==========================================================================
   JOURNAL
   ========================================================================== */
function renderJournal(){
  const c=document.getElementById('journalBody');
  c.innerHTML='<div class="today-hero"><h1>Your Reflections</h1><p>Write what it stirs. Come back to see what shifts.</p></div>'+
    '<div style="max-width:600px;margin:0 auto">'+
    '<div class="phase-card"><h2 style="font-size:1.1rem;margin-bottom:10px">New reflection</h2>'+
    '<textarea id="journalText" placeholder="One sentence is enough."></textarea>'+
    '<div class="action-row" style="justify-content:flex-start;margin-top:4px"><button class="btn btn-primary" onclick="saveJournal()">Save reflection</button></div></div>'+
    (state.journal.length?state.journal.map((e,i)=>'<div class="phase-card"><div style="font-size:.78rem;color:var(--mute);margin-bottom:4px">'+esc(e.date)+'</div><div style="font-family:var(--font-display);font-weight:700;font-size:1.02rem;margin-bottom:4px">'+esc(e.cardName)+'</div><div style="font-size:.92rem;line-height:1.6;white-space:pre-wrap">'+esc(e.text)+'</div><button class="btn btn-ghost btn-small" style="margin-top:6px" onclick="deleteJournal('+i+')">Delete</button></div>').join(''):'<div class="phase-card" style="text-align:center"><p style="color:var(--mute);font-size:.9rem">Your journal is quiet.</p></div>')+
    '</div>';
}
window.renderJournal=renderJournal;
function saveJournal(){
  const t=document.getElementById('journalText').value.trim();
  if(!t){alert("Write something first, even one sentence.");return}
  state.journal.unshift({date:todayStr(),cardName:state.diagStrained?L[state.diagStrained]:"Reflection",text:t});
  saveState();renderJournal();
}
window.saveJournal=saveJournal;
function deleteJournal(i){ state.journal.splice(i,1); saveState(); renderJournal(); }
window.deleteJournal=deleteJournal;

/* ==========================================================================
   REFLEXIVITY (standalone page mirrors protocol phase)
   ========================================================================== */
function renderReflexivity(){
  const r=state.reflexivity;
  document.getElementById('reflexBody').innerHTML=
    '<div class="today-hero"><h1>Reflexivity note</h1><p>Immediately after. Within 30 minutes.</p></div>'+
    '<div class="phase-card" style="max-width:640px">'+
    '<label>Where did I lead her?</label><textarea>'+esc(r.led||"")+'</textarea>'+
    '<label>What did I feel defensive about?</label><textarea>'+esc(r.defensive||"")+'</textarea>'+
    '<label>What did I want her to say?</label><textarea>'+esc(r.wanted||"")+'</textarea>'+
    '<label>What did I observe versus infer?</label><textarea>'+esc(r.inferenceVsFact||"")+'</textarea>'+
    '<div class="field-help">The full reflexivity form lives in the Protocol phase. This page is a quick reference.</div>'+
    '</div>';
}

/* ==========================================================================
   EXPORT — Airtable-shaped JSON
   ========================================================================== */
function renderExport(){
  const total=totalEmergencies();
  const data={
    participantCode:state.participantCode||"Unclear",
    "Consent reconfirmed at session":state.consent.participate===true?"Yes":state.consent.participate===false?"No":"Unclear",
    "Recording used?":state.consent.record===true?"Yes":state.consent.record===false?"No":"Unclear",
    "Safety Pause":state.safetyPause==="no"?"No":state.safetyPause==="yes"?"Yes":"Unclear",
    "Baseline — Why today? (verbatim)":state.baseline.whyToday||"Unclear",
    "Baseline — Biggest need (verbatim)":state.baseline.biggestNeed||"Unclear",
    "Baseline — Useful outcome (verbatim)":state.baseline.usefulOutcome||"Unclear",
    "Soft Dive choice":state.softdive.choice||"Unclear",
    "Tree map / card placements":state.treeNeeds,
    "Participant explanation of reflection":state.buildtree.structureHelps||"Unclear",
    "Framework Fit Observed":state.buildtree.structureMisses||"Unclear",
    "Interpretation evidence / explanation":state.mirror.participantResponse||"Unclear",
    "Tension confirmed / rejected / clarified":state.mirror.tensionStatus||"Unclear",
    "Realism Judged":(state.realism&&state.realism.realismJudged)||"Unclear",
    "Failure Logs: Exact Quote":state.buildtree.mismatch||"Unclear",
    "Failure Logs: Researcher interpretation":"",
    "Dark Needs Consented":state.darkConsent===true?"Yes":state.darkConsent===false?"No":"Not offered",
    "Enough Definition (verbatim)":state.anchor.enough||"Unclear",
    "Session Outcome / participant feedback":state.certificate.feedback||"No feedback offered",
    "Final — Biggest need":state.returnPhase.biggestNeed||"Unclear",
    "Final — Useful outcome":state.returnPhase.usefulOutcome||"Not asked",
    "End-of-session interpretation":state.endInterpretation||"Unclear",
    "Facilitator Reflexivity Note":state.reflexivity,
    "Session Data Completeness":state.reflexivity.complete||"Unclear",
    "Dark Needs":state.darkConsent===true?"Offered and accepted":state.darkConsent===false?"Declined":"Not offered",
    "Emergencies":state.emergencyPicks,
    "Total emergencies":total,
    "If-then plans":{cue:state.ifThenCue,action:state.ifThenAction},
    "Chosen actions":state.chosenActions
  };
  const json=JSON.stringify(data,null,2);
  const csv = exportCsv(data);
  document.getElementById('exportBody').innerHTML=
    '<div class="today-hero"><h1>Export</h1><p>Airtable-shaped JSON and CSV. Missing data is marked Unclear or Not offered — never a silent No.</p></div>'+
    '<div class="phase-card" style="max-width:760px">'+
    '<h2 style="font-size:1.05rem;margin-bottom:10px">Airtable fields</h2>'+
    '<pre style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:.78rem;overflow:auto;max-height:420px;white-space:pre-wrap">'+esc(json)+'</pre>'+
    '<div class="action-row" style="justify-content:flex-start;margin-top:10px">'+
      '<button class="btn btn-primary" onclick="copyExport()">Copy JSON</button>'+
      '<button class="btn btn-outline" onclick="downloadExport()">Download CSV</button>'+
      '<button class="btn btn-ghost" onclick="navigateTo(\'protocol\')">Back to protocol</button>'+
    '</div>'+
    '<div class="airtable-note" style="margin-top:14px"><strong>Reminder:</strong> A before/after difference does not prove causation. Missing data is not a No. Keep verbatim quotes separate from researcher interpretation.</div>'+
    '</div>';
  window._exportJson=json; window._exportCsv=csv;
}
window.renderExport=renderExport;
function exportCsv(obj){
  const rows=[];
  const flat=(prefix,v)=>{
    if(v&&typeof v==="object"&&!Array.isArray(v)){
      Object.keys(v).forEach(k=>flat(prefix?prefix+"."+k:k,v[k]));
    } else {
      rows.push([prefix,Array.isArray(v)?v.join(" | "):String(v==null?"":v)]);
    }
  };
  Object.keys(obj).forEach(k=>flat(k,obj[k]));
  return "Field,Value\n"+rows.map(r=>'"'+r[0].replace(/"/g,'""')+'","'+r[1].replace(/"/g,'""')+'"').join("\n");
}
function copyExport(){
  navigator.clipboard.writeText(window._exportJson||"").then(()=>alert("JSON copied.")).catch(()=>alert("Copy failed — select manually."));
}
window.copyExport=copyExport;
function downloadExport(){
  const blob=new Blob([window._exportCsv||""],{type:"text/csv"});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(state.participantCode||"needs-tree")+"-session.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
window.downloadExport=downloadExport;

/* ==========================================================================
   INIT
   ========================================================================== */
loadState();
renderProtocol();

/* Persist on interaction */
document.addEventListener('click',()=>setTimeout(saveState,50),true);
document.addEventListener('input',()=>saveState(),true);
document.addEventListener('change',()=>saveState(),true);
window.addEventListener('beforeunload',saveState);
</script>
